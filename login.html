<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Championnat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h2>Accès Organisateur</h2>
            <!-- L'ID "loginForm" permet un ciblage JavaScript parfait -->
            <form id="loginForm">
                <div class="form-group">
                    <label>Adresse Email</label>
                    <input type="email" id="email" placeholder="exemple@ligue.com" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit">Se connecter</button>
            </form>
        </div>
    </div>
    
    <!-- Lien vers le script JS isolé -->
    <script src="js/login.js"></script>
</body>
</html>
