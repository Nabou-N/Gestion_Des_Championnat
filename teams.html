<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Les Clubs du Championnat</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .team-card { background: #000000; padding: 20px; border-radius: 8px; border: 1px solid #2d3d5a; text-align: center; cursor: pointer; transition: 0.2s; }
        .team-card:hover { transform: translateY(-3px); border-color: #00ff87; }
        .players-list { margin-top: 15px; text-align: left; background: #121824; padding: 10px; border-radius: 6px; display: none; color: #fff; }
        .player-item { padding: 5px 0; border-bottom: 1px solid #1a2333; font-size: 0.9em; display: flex; justify-content: space-between; }
    </style>
</head>

    <div class="container">
        <nav>
            <h2>🏆 LiveLeague</h2>
            <div>
                <a href="index.html">Classement</a>
                <a href="stats.html">Statistiques</a>
                <a href="teams.html" class="active">Équipes</a>
                <a href="login.html">Connexion</a>
            </div>
        </nav>

        <h1>Clubs Participants & Effectifs</h1>
        
        <div class="teams-grid" id="teams-container">
            <p style="text-align: center; grid-column: span 3;">Chargement des clubs...</p>
        </div>
    </div>

    <script src="js/teams.js"></script>
</body>
</html>
